<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JobLink NG</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075e54">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    color:#222;
}

header{
    background:#075e54;
    color:white;
    padding:18px 15px;
    position:sticky;
    top:0;
    z-index:10;
}

.header-box{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:12px;
    font-size:14px;
}

.hero{
    background:white;
    padding:30px 15px;
    text-align:center;
}

.hero h1{
    color:#075e54;
    margin-bottom:10px;
}

.hero p{
    color:#666;
    margin-bottom:20px;
}

.search-box{
    max-width:700px;
    margin:auto;
    display:flex;
    gap:8px;
}

.search-box input{
    flex:1;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    background:#075e54;
    color:white;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    opacity:.9;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.section-title{
    margin-bottom:15px;
    color:#075e54;
}

#jobs{
    display:grid;
    gap:15px;
}

.job-card{
    background:white;
    border-radius:10px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.job-card h3{
    color:#075e54;
    margin-bottom:8px;
}

.job-card p{
    margin:6px 0;
    color:#555;
}

.job-card button{
    margin-top:12px;
}

.empty{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:10px;
    color:#777;
}

#message{
    margin:15px 0;
    padding:12px;
    border-radius:8px;
    display:none;
}

.success{
    background:#d9f5e9;
    color:#075e54;
}

.error{
    background:#ffe1e1;
    color:#a00000;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:100;
    padding:20px;
    overflow:auto;
}

.modal-box{
    background:white;
    max-width:600px;
    margin:40px auto;
    padding:22px;
    border-radius:12px;
}

.modal-box h2{
    color:#075e54;
    margin-bottom:15px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.close{
    background:#777;
    margin-left:8px;
}

footer{
    text-align:center;
    padding:25px;
    margin-top:40px;
    background:#075e54;
    color:white;
}

@media(max-width:600px){
    .header-box{
        flex-direction:column;
        gap:10px;
    }

    nav a{
        margin:0 5px;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-box">
        <div class="logo">JobLink NG</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#jobs-section">Jobs</a>
        </nav>
    </div>
</header>

<section class="hero" id="home">

    <h1>Find Your Next Job</h1>

    <p>Discover job opportunities and apply easily with JobLink NG.</p>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search jobs..."
        >

        <button onclick="searchJobs()">
            Search
        </button>
    </div>

</section>

<div class="container">

    <div id="message"></div>

    <section id="jobs-section">

        <h2 class="section-title">
            Available Jobs
        </h2>

        <div id="jobs">

            <div class="empty">
                Loading jobs...
            </div>

        </div>

    </section>

</div>

<div class="modal" id="applicationModal">

    <div class="modal-box">

        <h2>Apply for Job</h2>

        <p id="selectedJob"></p>

        <form id="applicationForm">

            <div class="form-group">
                <label>Full Name</label>

                <input
                    type="text"
                    id="applicantName"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="applicantEmail"
                    required
                >
            </div>

            <div class="form-group">
                <label>Phone Number</label>

                <input
                    type="tel"
                    id="applicantPhone"
                    required
                >
            </div>

            <div class="form-group">
                <label>Upload CV</label>

                <input
                    type="file"
                    id="cvFile"
                    accept=".pdf,.doc,.docx"
                    required
                >
            </div>

            <button type="submit">
                Submit Application
            </button>

            <button
                type="button"
                class="close"
                onclick="closeApplication()"
            >
                Cancel
            </button>

        </form>

    </div>

</div>

<footer>
    <p>© 2026 JobLink NG. All rights reserved.</p>
</footer>
