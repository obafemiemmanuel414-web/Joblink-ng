<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JobLink NG</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075e54">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    color:#222;
}

header{
    background:#075e54;
    color:white;
    padding:18px 15px;
    position:sticky;
    top:0;
    z-index:10;
}

.header-box{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:12px;
    font-size:14px;
}

.hero{
    background:white;
    padding:30px 15px;
    text-align:center;
}

.hero h1{
    color:#075e54;
    margin-bottom:10px;
}

.hero p{
    color:#666;
    margin-bottom:20px;
}

.search-box{
    max-width:700px;
    margin:auto;
    display:flex;
    gap:8px;
}

.search-box input{
    flex:1;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    background:#075e54;
    color:white;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    opacity:.9;
}

.container{
    max-width:900px;
    margin:25px auto;
    padding:0 15px;
}

.section-title{
    margin-bottom:15px;
    color:#075e54;
}

#jobs{
    display:grid;
    gap:15px;
}

.job-card{
    background:white;
    border-radius:10px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.job-card h3{
    color:#075e54;
    margin-bottom:8px;
}

.job-card p{
    margin:6px 0;
    color:#555;
}

.job-card button{
    margin-top:12px;
}

.empty{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:10px;
    color:#777;
}

#message{
    margin:15px 0;
    padding:12px;
    border-radius:8px;
    display:none;
}

.success{
    background:#d9f5e9;
    color:#075e54;
}

.error{
    background:#ffe1e1;
    color:#a00000;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:100;
    padding:20px;
    overflow:auto;
}

.modal-box{
    background:white;
    max-width:600px;
    margin:40px auto;
    padding:22px;
    border-radius:12px;
}

.modal-box h2{
    color:#075e54;
    margin-bottom:15px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.form-group input,
.form-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.close{
    background:#777;
    margin-left:8px;
}

footer{
    text-align:center;
    padding:25px;
    margin-top:40px;
    background:#075e54;
    color:white;
}

@media(max-width:600px){
    .header-box{
        flex-direction:column;
        gap:10px;
    }

    nav a{
        margin:0 5px;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-box">
        <div class="logo">JobLink NG</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#jobs-section">Jobs</a>
        </nav>
    </div>
</header>

<section class="hero" id="home">

    <h1>Find Your Next Job</h1>

    <p>Discover job opportunities and apply easily with JobLink NG.</p>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Search jobs..."
        >

        <button onclick="searchJobs()">
            Search
        </button>
    </div>

</section>

<div class="container">

    <div id="message"></div>

    <section id="jobs-section">

        <h2 class="section-title">
            Available Jobs
        </h2>

        <div id="jobs">

            <div class="empty">
                Loading jobs...
            </div>

        </div>

    </section>

</div>

<div class="modal" id="applicationModal">

    <div class="modal-box">

        <h2>Apply for Job</h2>

        <p id="selectedJob"></p>

        <form id="applicationForm">

            <div class="form-group">
                <label>Full Name</label>

                <input
                    type="text"
                    id="applicantName"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>

                <input
                    type="email"
                    id="applicantEmail"
                    required
                >
            </div>

            <div class="form-group">
                <label>Phone Number</label>

                <input
                    type="tel"
                    id="applicantPhone"
                    required
                >
            </div>

            <div class="form-group">
                <label>Upload CV</label>

                <input
                    type="file"
                    id="cvFile"
                    accept=".pdf,.doc,.docx"
                    required
                >
            </div>

            <button type="submit">
                Submit Application
            </button>

            <button
                type="button"
                class="close"
                onclick="closeApplication()"
            >
                Cancel
            </button>

        </form>

    </div>

</div>

<footer>
    <p>© 2026 JobLink NG. All rights reserved.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let allJobs = [];
let selectedJobId = null;


/* =====================================================
   LOAD JOBS
===================================================== */

async function loadJobs(){

    const jobsContainer = document.getElementById("jobs");

    jobsContainer.innerHTML = `
        <div class="empty">
            Loading jobs...
        </div>
    `;

    try{

        const { data, error } = await db
            .from("Jobs")
            .select("*")
            .order("id", { ascending:false });

        if(error){
            console.error(error);

            jobsContainer.innerHTML = `
                <div class="empty">
                    Unable to load jobs.
                    <br><br>
                    Please try again.
                </div>
            `;

            return;
        }

        allJobs = data || [];

        displayJobs(allJobs);

    }catch(error){

        console.error(error);

        jobsContainer.innerHTML = `
            <div class="empty">
                Something went wrong while loading jobs.
            </div>
        `;
    }
}


/* =====================================================
   DISPLAY JOBS
===================================================== */

function displayJobs(jobs){

    const jobsContainer = document.getElementById("jobs");

    if(!jobs || jobs.length === 0){

        jobsContainer.innerHTML = `
            <div class="empty">
                No jobs available at the moment.
            </div>
        `;

        return;
    }

    jobsContainer.innerHTML = "";

    jobs.forEach(job => {

        const title =
            job.title ||
            job.Title ||
            job.job_title ||
            job.Job ||
            "Job Opportunity";

        const company =
            job.company ||
            job.Company ||
            job.company_name ||
            "Company not specified";

        const location =
            job.location ||
            job.Location ||
            "Location not specified";

        const description =
            job.description ||
            job.Description ||
            job.details ||
            "No job description provided.";

        const card = document.createElement("div");

        card.className = "job-card";

        card.innerHTML = `
            <h3>${escapeHTML(title)}</h3>

            <p>
                <strong>Company:</strong>
                ${escapeHTML(company)}
            </p>

            <p>
                <strong>Location:</strong>
                ${escapeHTML(location)}
            </p>

            <p>
                ${escapeHTML(description)}
            </p>

            <button onclick="openApplication('${job.id}')">
                Apply Now
            </button>
        `;

        jobsContainer.appendChild(card);
    });
}


/* =====================================================
   SEARCH JOBS
===================================================== */

function searchJobs(){

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    if(!search){

        displayJobs(allJobs);

        return;
    }

    const filtered = allJobs.filter(job => {

        const text = Object.values(job)
            .join(" ")
            .toLowerCase();

        return text.includes(search);
    });

    displayJobs(filtered);
}


/* =====================================================
   ENTER KEY SEARCH
===================================================== */

document
.getElementById("searchInput")
.addEventListener("keydown", function(event){

    if(event.key === "Enter"){
        searchJobs();
    }

});


/* =====================================================
   OPEN APPLICATION
===================================================== */

function openApplication(jobId){

    selectedJobId = jobId;

    const job = allJobs.find(
        item => String(item.id) === String(jobId)
    );

    if(!job){
        showMessage(
            "Job could not be found.",
            "error"
        );

        return;
    }

    const title =
        job.title ||
        job.Title ||
        job.job_title ||
        job.Job ||
        "Job Opportunity";

    document.getElementById("selectedJob").innerHTML =
        `<strong>Applying for:</strong> ${escapeHTML(title)}`;

    document.getElementById("applicationModal").style.display = "block";
}


/* =====================================================
   CLOSE APPLICATION
===================================================== */

function closeApplication(){

    document.getElementById("applicationModal").style.display = "none";

    document.getElementById("applicationForm").reset();

    selectedJobId = null;
}


/* =====================================================
   SUBMIT APPLICATION
===================================================== */

document
.getElementById("applicationForm")
.addEventListener("submit", async function(event){

    event.preventDefault();

    if(!selectedJobId){

        showMessage(
            "Please select a job first.",
            "error"
        );

        return;
    }

    const name =
        document.getElementById("applicantName").value.trim();

    const email =
        document.getElementById("applicantEmail").value.trim();

    const phone =
        document.getElementById("applicantPhone").value.trim();

    const cv =
        document.getElementById("cvFile").files[0];

    if(!name || !email || !phone || !cv){

        showMessage(
            "Please complete all application fields.",
            "error"
        );

        return;
    }

    const submitButton =
        document.querySelector(
            "#applicationForm button[type='submit']"
        );

    submitButton.disabled = true;
    submitButton.textContent = "Submitting...";

    try{

        /*
         * Upload CV
         */

        const fileName =
            Date.now() +
            "_" +
            cv.name.replace(/\s+/g, "_");

        const filePath =
            "applications/" + fileName;


        const { error: uploadError } =
            await db.storage
            .from("CV")
            .upload(
                filePath,
                cv,
                {
                    upsert:false
                }
            );


        if(uploadError){

            console.error(uploadError);

            showMessage(
                "CV upload failed. Please try again.",
                "error"
            );

            submitButton.disabled = false;
            submitButton.textContent = "Submit Application";

            return;
        }


        /*
         * Save application
         */

        const applicationData = {

            Name: name,

            Email: email,

            Phone: phone,

            cv_path: filePath,

            job_id: selectedJobId

        };


        const { error: insertError } =
            await db
            .from("Applications")
            .insert([applicationData]);


        if(insertError){

            console.error(insertError);

            showMessage(
                "Your CV uploaded, but the application could not be saved.",
                "error"
            );

            submitButton.disabled = false;
            submitButton.textContent = "Submit Application";

            return;
        }


        /*
         * Success
         */

        closeApplication();

        showMessage(
            "Application submitted successfully! 🎉",
            "success"
        );

    }catch(error){

        console.error(error);

        showMessage(
            "Something went wrong. Please try again.",
            "error"
        );

    }

    submitButton.disabled = false;
    submitButton.textContent = "Submit Application";

});


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(message,type){

    const box =
        document.getElementById("message");

    box.textContent = message;

    box.className = "";

    box.classList.add(type);

    box.style.display = "block";

    setTimeout(() => {

        box.style.display = "none";

    },5000);
}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
===================================================== */

window.addEventListener("click", function(event){

    const modal =
        document.getElementById("applicationModal");

    if(event.target === modal){

        closeApplication();

    }

});


/* =====================================================
   START APP
===================================================== */

loadJobs();

</script>

</body>
</html>
